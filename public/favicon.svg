<?xml version="1.0" encoding="UTF-8"?>
<!-- Voxrail logo mark (placeholder): a square plate in the primary ink
     (#171717 = oklch(0.205 0 0)) with a geometric "V" knocked out in the
     primary-foreground ink (#fafafa = oklch(0.985 0 0)). Drawn as a stroked
     chevron rather than text, so no font is involved and favicon.ico is
     generated from this exact geometry.
     One asset serves both themes: on a light surface the plate reads as the
     mark, on a dark surface the plate recedes and the "V" carries it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="Voxrail">
  <rect x="0" y="0" width="500" height="500" rx="110" ry="110" fill="#171717" />
  <path d="M152 120 L250 330 L348 120" fill="none" stroke="#fafafa" stroke-width="54" stroke-linecap="butt" stroke-linejoin="miter" />
</svg>
