<?xml version="1.0" encoding="UTF-8"?>
<!-- Voxspur mark, small-size drawing for favicons (16 to 48 px): the same
     drawing as voxspur-mark.svg with heavier strokes so it stays crisp. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="Voxspur">
  <rect width="500" height="500" rx="110" fill="#141816"/>
  <g transform="translate(-14 13)">
    <path d="M 135 110 L 228 352" fill="none" stroke="#fafafa" stroke-width="56" stroke-linecap="round"/>
    <path d="M 228 352 Q 250 400 272 352 L 340 175" fill="none" stroke="#37d16c" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="352" cy="140" r="44" fill="#141816" stroke="#37d16c" stroke-width="50"/>
  </g>
</svg>
