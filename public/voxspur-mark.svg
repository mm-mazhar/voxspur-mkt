<?xml version="1.0" encoding="UTF-8"?>
<!-- Voxspur mark. A dark plate; an inbound line in chalk and an outbound
     line in Signal Green meet at one rounded turn to form a "V", and the green
     line ends at a ring stop, the same stop used across the site.
     Fixed colours so one file works on dark and light surfaces:
     plate #141816, chalk #fafafa, Signal Green #37d16c. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="Voxspur">
  <rect width="500" height="500" rx="110" fill="#141816"/>
  <g transform="translate(-14 13)">
    <path d="M 135 110 L 228 352" fill="none" stroke="#fafafa" stroke-width="44" stroke-linecap="round"/>
    <path d="M 228 352 Q 250 400 272 352 L 340 175" fill="none" stroke="#37d16c" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="352" cy="140" r="44" fill="#141816" stroke="#37d16c" stroke-width="38"/>
  </g>
</svg>
