<!-- Voxspur mark. A dark plate; a main line in chalk; a spur in Signal Green
     that leaves the line through an arc, climbs at 45 degrees and ends at a
     stop marker; two arcs spread from the stop, the voice carried out along
     the spur. Colours are fixed so one file works on dark and light surfaces:
     plate #141816, chalk #fafafa, Signal Green #37d16c. -->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="Voxspur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="500" rx="110" fill="#141816"/>
  <path d="M98.00 394.00A56 56 0 0 0 137.60 377.60L287.60 227.60" fill="none" stroke="#37d16c" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 394L408 394" fill="none" stroke="#fafafa" stroke-width="38" stroke-linecap="round"/>
  <circle cx="287.60" cy="227.60" r="33" fill="#141816" stroke="#37d16c" stroke-width="20"/>
  <path d="M291.99 143.71A84 84 0 0 1 371.48 223.20" fill="none" stroke="#37d16c" stroke-width="28" stroke-linecap="round"/>
  <path d="M294.30 99.77A128 128 0 0 1 415.42 220.90" fill="none" stroke="#37d16c" stroke-width="28" stroke-linecap="round"/>
</svg>
